name: CI

# Runs the same commands as a developer: `mm bootstrap` and `mm check`, then
# the Android build of the shell. CI calls `mm`, never npm or gradle
# directly, so local and CI behavior cannot drift (MM-7).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The tests alone take about 20 minutes now (2026-10-24), then the stories, the build and Android's.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Bootstrap
        run: ./mm bootstrap

      - name: Check (requirements, panel, tool tests, web)
        run: ./mm check

      # The Android shell (MM-232): the web app synced in and assembled.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android (debug)
        run: ./mm build android
