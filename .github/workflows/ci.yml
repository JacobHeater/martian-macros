name: CI

# Runs the same commands as a developer: `mm bootstrap` and `mm check`, then an
# Android build. CI calls `mm`, never `flutter` directly, so local and CI
# behavior cannot drift (MM-7). The screenshot tests (MM-105) run here, on Linux,
# as part of `mm check`; the "Update goldens" workflow regenerates their images.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Bootstrap
        run: ./mm bootstrap
        env:
          MM_FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}

      - name: Check (format, requirements, architecture, analyze, test)
        run: ./mm check
        env:
          MM_FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}

      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/mobile/test/goldens/failures
          if-no-files-found: ignore

      - name: Build Android (dev)
        run: ./mm build android --env dev
        env:
          MM_FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
