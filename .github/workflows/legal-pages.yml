name: Legal page

# MM-247: the terms of use and the privacy policy, published to GitHub Pages
# from the same source the app shows (apps/mobile/src/terms/), so the stores
# link to the app's own text. Only the one generated folder is published
# (index.html, nothing else from the repository). Added by the owner's merge,
# never an agent's, as every new workflow is.
#
# Needs, once, in the repository's settings: Pages, "Build and deployment",
# source "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/terms/**'
      - 'apps/mobile/src/format/**'
      - 'apps/mobile/src/domain/**'
      - 'apps/mobile/src/lang/**'
      - 'apps/mobile/scripts/legal-page.mjs'
      - '.github/workflows/legal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Bootstrap
        run: ./mm bootstrap

      - name: Build the page
        run: ./mm legal "$RUNNER_TEMP/legal-site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/legal-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
