apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.martianmacros"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.martianmacros"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The three identities (MM-8, MM-177): the real app, a development twin
    // beside it, and the seeded demo, each its own app ID and sandbox. A
    // flavor changes only the id and the name; everything else is the same
    // build. `mm run` and `mm build` pass the one that matches `--env`.
    flavorDimensions = ["identity"]
    productFlavors {
        prod {
            dimension "identity"
            resValue "string", "app_name", "Martian Macros"
            resValue "string", "title_activity_main", "Martian Macros"
            resValue "string", "package_name", "com.martianmacros"
            resValue "string", "custom_url_scheme", "com.martianmacros"
        }
        dev {
            dimension "identity"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Martian Macros Dev"
            resValue "string", "title_activity_main", "Martian Macros Dev"
            resValue "string", "package_name", "com.martianmacros.dev"
            resValue "string", "custom_url_scheme", "com.martianmacros.dev"
        }
        demo {
            dimension "identity"
            applicationIdSuffix ".demo"
            resValue "string", "app_name", "Martian Macros DEMO"
            resValue "string", "title_activity_main", "Martian Macros DEMO"
            resValue "string", "package_name", "com.martianmacros.demo"
            resValue "string", "custom_url_scheme", "com.martianmacros.demo"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The app's own SQLite (MM-231), the same library on every Android
    // version, with FTS5 for food search.
    implementation "androidx.sqlite:sqlite-bundled:2.7.1"
    // The camera, reading barcodes and label text on the device (MM-43, MM-44).
    implementation "androidx.camera:camera-camera2:1.5.2"
    implementation "androidx.camera:camera-lifecycle:1.5.2"
    implementation "androidx.camera:camera-view:1.5.2"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Health Connect, read-only (MM-68).
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
