name: martian_macros
description: Martian Macros — body-composition coaching app.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  mm_data: any
  mm_domain: any
  mm_engine: any
  mm_food_catalog: any
  path_provider: ^2.1.5

dev_dependencies:
  crypto: ^3.0.6
  drift: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mm_fixtures: any

flutter:
  uses-material-design: true
  assets:
    - assets/evidence.md
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
