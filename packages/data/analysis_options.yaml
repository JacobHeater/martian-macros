include: ../../analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    # Written by `mm schema` (drift_dev).
    - test/generated_migrations/**

linter:
  rules:
    # Drift's CHECK-constraint idiom references the column inside its own
    # getter (`integer().check(id.equals(1))`); it is not real recursion.
    recursive_getters: false
