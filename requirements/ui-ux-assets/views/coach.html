<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach · Martian Macros UI reference</title>
<link rel="stylesheet" href="../shared/mm.css">
<script src="../shared/mm.js"></script>
</head>
<body>
<script>
(function (m) {
  var bar = { title: 'Coach', acts: ['gear'] };
  var hero = m.hero({ pct: 27, fig: '1,534', cap: 'kcal left of 2,100', parts: [m.macros()] });
  var targets = m.info('Your targets', [
    m.stat('Protein minimum', '131 g'), m.stat('Intended pace', '−0.75% / week'), '<p class="cap right">−1.4 lb a week</p>',
    m.stat('Next check-in', 'Mon, Oct 12'), m.stat('Coach confidence', 'Good'),
    m.notice('caution', 'This week’s change was limited to a small step. Targets move gradually so one odd week can’t swing them.', { title: 'Heads up' })]);
  var lastChange = m.info('Last change · Today', [m.p('Calories 2,200 → 2,100. Your expenditure is 2,640 kcal a day, down from 2,740 (−100).'),
    m.rowx([m.btn('See why', 'secondary', { sm: true, show: 'why' }), m.btn('History', 'text', { sm: true })])]);
  var adherence = m.info('Your last 7 days', [m.stat('Days logged', '7, 6 complete'), m.stat('Weigh-ins', '6'),
    m.stat('Average intake', '2,180 kcal against 2,200'), m.stat('Protein minimum met', '5 of 6 days'),
    m.cap('The seven days to yesterday. Days you did not log are not counted against anything.')]);
  var reports = m.info('Monthly reports', [m.row('Sep 6 – Oct 5', '', m.i('right', 's'), { cls: 'bare' })]);
  var recovery = m.info('How you are holding up', [
    m.p('Five quick questions a week on hunger, energy, sleep, training and mood. They are what the food log and the scale cannot see.', 't2')].concat(
    ['Hunger', 'Energy', 'Sleep', 'Training', 'Mood'].map(function (q, n) { return m.rowx(['<span class="grow">' + q + '</span><span class="t2">' + [3, 4, 3, 4, 4][n] + ' of 5</span>', m.spark()]); })).concat([
    m.cap('1 is the hard end, 5 the easy end. Your answers only ever lead to an offer of relief, never to a lower target.'),
    m.rowx([m.btn('Answer this week', 'primary', { sm: true }), m.btn('Skip this week', 'text', { sm: true })])]));
  var metabolism = m.info('Your metabolism', [m.p('Measured from your logged food and weight trend.'), m.p('Probably between 2,542 and 2,733 kcal a day.', 't2'),
    m.disc('Your metabolism estimate', [m.stat('Logged days used', '26'), m.stat('Weigh-ins used', '28'), m.stat('Partial days left out', '4')], false)]);
  var confidence = m.info('Coach confidence · Good', [m.p('Keep logging food and weight consistently; that will make the estimate firmer.'),
    m.disc('What this rests on', [m.stat('Estimate', 'Good'), m.stat('Food log', 'Good'), m.stat('Weigh-ins', 'Good'), m.stat('Stability', 'Good')], true)]);
  var goal = m.info('Goal: Fat loss', [m.p('Lose fat at a steady pace while keeping muscle.', 't2')], m.btn('Change', 'text', { sm: true, show: 'goal' }));
  var body = m.info('Body', [m.stat('Trend weight', '184.1 lb'), m.stat('Body fat', '20–26% (rough estimate)'), m.stat('Resting energy (BMR)', '1,790 kcal')]);
  var why = function (hidden) {
    return m.sheet([m.title('Why your targets are what they are'),
      m.heading('What changed'), m.p('Calories 2,200 → 2,100. Protein target unchanged. Carbohydrate 245 → 230 g. Fat unchanged'),
      m.heading('Why'), m.p('Your expenditure is 2,640 kcal a day, down from 2,740 (−100).'), m.p('Weekly changes are limited, so 15 kcal of the decrease is held for next week.'),
      m.heading('What it was based on'), m.p('26 days of food, 4 left out as partial and 28 weigh-ins. Your expenditure is measured.'),
      m.heading('What would change it'), m.p('The rest of the change arrives over the next weeks, in weekly steps.', 't2'),
      m.btn('Keep last week’s targets for now', 'secondary', { block: true, hide: true }), m.cap('Targets stay as they are this week, and the change can come at the next check-in. You can do this once; not twice running.')], { id: 'why', hidden: hidden });
  };
  var goalDialog = function (hidden) {
    return '<div class="scrim mid" data-layer="goal"' + (hidden ? ' hidden' : '') + '><div class="dialog"><div class="heading">Choose a goal</div>' + m.choices([
      m.choice('Fat loss', 'Lose fat at a steady pace while keeping muscle.', { on: true, tag: 'Recommended' }), m.choice('Recomp', 'Hold weight roughly steady while trading fat for muscle.'),
      m.choice('Lean gain', 'Build muscle in a small, controlled surplus.'), m.choice('Maintenance', 'Hold where you are.')]) + '<div class="acts">' + m.btn('Cancel', 'text', { hide: true }) + '</div></div></div>';
  };

  m.page({
    title: 'Coach',
    intro: 'What the coach has set and why: targets, the last change, how sure it is, and the cards that appear when something needs saying. Target history, monthly reports and the weekly recovery check-in open from here.',
    sources: ['apps/mobile/lib/src/coach/', 'apps/mobile/lib/src/app/check_in_host.dart', 'apps/mobile/lib/src/app/target_change_summary_host.dart'],
    tickets: ['MM-24', 'MM-25', 'MM-23', 'MM-138', 'MM-139', 'MM-140', 'MM-141', 'MM-149', 'MM-33', 'MM-133', 'MM-116', 'MM-117', 'MM-114', 'MM-115', 'MM-28', 'MM-31'],
    limits: 'The numbers are fixture data and do not reconcile with one another. No screenshot test covers the cards below the targets card, the sheet, the reports or the check-in; those are drawn from source.',
    sections: [
      { h: 'Coach', frames: [
        m.frame('coach-default', 'With measured targets', 'Tap See why for the explanation sheet, Change for the goal chooser.', m.phone({ bar: bar, nav: 'coach', body: [hero, targets, lastChange, adherence, reports, recovery, metabolism, confidence, goal, body], over: [why(true), goalDialog(true)] })),
        m.frame('coach-first-day', 'Before the first weigh-in', '', m.phone({ cls: 'short', bar: bar, nav: 'coach', body: [m.p('Log a weigh-in to get started.', 't2')] })),
        m.frame('coach-learning', 'While the coach is learning', 'Calibration: targets hold and the estimate is the starting one.', m.phone({ cls: 'short', bar: bar, body: [
          m.info('Your targets', [m.stat('Protein minimum', '131 g'), m.stat('Intended pace', '−0.75% / week'), m.stat('Next check-in', 'Mon, Oct 12'), m.stat('Coach confidence', 'Learning'),
            m.cap('Targets are unchanged because there is not enough data yet. 6 more fully logged days and 4 more weigh-ins.')]),
          m.info('Last change · Sep 28', [m.p('Your first targets.')], ''),
          m.info('Your metabolism', [m.p('Starting estimate; it improves as you log food and weight.'),
            m.notice('info', 'Needs 6 more fully logged days and 4 more weigh-ins before your first measurement.'),
            m.cap('Starting estimate from your sex, age, height, weight, daily activity and training days. It gets replaced by a measurement of your body.')]),
          m.info('Coach confidence · Learning', [m.p('Targets are held while the coach learns.', 't2'), m.p('Log food and mark days complete when they are. You need 6 more usable days to reach the minimum.')])] }))
      ] },
      { h: 'Cards that appear when they apply', frames: [
        m.frame('coach-flags', 'Target flags and cautions', 'A flag explains a limit on the targets; a caution comes from the health check.', m.phone({ cls: 'short', bar: bar, body: [
          m.notice('safety', 'Your calories are at the lowest level the app will set. Going lower risks your health and your muscle.', { title: 'Safety' }),
          m.notice('caution', 'You were losing weight faster than the app aims for at your body fat, because faster loss costs more muscle. Targets went up.', { title: 'Heads up' }),
          m.notice('caution', 'You’ve been in a deficit for 16 weeks. This is a maintenance break to recover before continuing.', { title: 'Heads up' }),
          m.notice('caution', 'Thyroid conditions affect energy needs. The app adapts to your measured results; keep your treatment stable where you can.'),
          m.notice('safety', 'After bariatric surgery, your surgical team should set your nutrition targets. The app will not issue coaching targets.', { title: 'Safety' })] })),
        m.frame('coach-under-eating', 'Logged days well under the floor', 'MM-114. Shown on Coach and Dashboard.', m.phone({ cls: 'short', bar: bar, body: [
          m.notice('caution', 'Your logged days average 1,050 kcal. The lowest the app would ever suggest for you is 1,500. If those days are missing food, mark them partial. If they are complete, that is less than the app considers enough. Eating at your target will not slow your progress the way it feels like it will. If eating has become a source of distress, a doctor or a registered dietitian is the right person to talk to.',
            { title: 'About your logged days', acts: [m.btn('Mark those days partial', 'secondary', { sm: true }), m.btn('They are complete', 'text', { sm: true })] })] })),
        m.frame('coach-relief', 'An offer to ease the deficit', 'MM-117. Never a lower target.', m.phone({ cls: 'short', bar: bar, body: [
          m.notice('info', 'Your last two check-ins had most answers at the hard end. On a deficit that usually means it is too large, or has run too long, for you right now. Easing it is the fix.<br><br>The coach would take a maintenance week: you are 9 weeks into this deficit, and a week at maintenance is a diet break taken early.',
            { title: 'Two hard weeks in a row', acts: [m.btn('Take a maintenance week', 'primary', { sm: true }), m.btn('Slow to 0.5% a week', 'secondary', { sm: true }), m.btn('Carry on', 'text', { sm: true })] })] })),
        m.frame('coach-stall', 'Progress has slowed', 'MM-140.', m.phone({ cls: 'short', bar: bar, body: [m.info('Progress has slowed', [
          m.p('Your average has been about 2,350 against a target of 2,100. At 2,350 the app would expect roughly the pace you are seeing.'), m.label('Options'), m.p('· Keep the target'), m.p('· Move to a gentler pace that matches what you are eating'),
          m.disc('What this rests on', [m.stat('Period', 'Last 21 days'), m.stat('Fully logged days', '18'), m.stat('Weigh-ins', '17'), m.stat('Trend', '−0.2 lb a week'), m.stat('Intended', '−1.4 lb a week')], true)])] })),
        m.frame('coach-insight', 'A rule-based insight', 'MM-141. One card per rule, each dismissible.', m.phone({ cls: 'short', bar: bar, body: [m.info('Protein has been under your minimum', [
          m.p('You met your protein minimum on 3 of 9 fully logged days. On the other days you were about 28 g short on average.'),
          m.disc('What this rests on', [m.stat('Period', 'Last 14 days'), m.stat('Fully logged days', '9'), m.stat('Days at or above the minimum', '3'), m.stat('Average shortfall', '28 g')], false), m.btn('Dismiss', 'text', { sm: true })]),
          m.info('Weigh-ins have been sparse', [m.p('You weighed in 3 times in the last two weeks. With four or more a week the coach can tell a real change from water sooner.'), m.btn('Dismiss', 'text', { sm: true })])] })),
        m.frame('coach-recomp-review', 'Recomp review', 'MM-133. At weeks 8 and 12 of a recomp.', m.phone({ cls: 'short', bar: bar, body: [m.info('Recomp review, week 8', [
          m.p('Probably working, slowly. Strength is the earliest signal, and yours is up. Keep going, and measure your waist every week.'),
          m.stat('Period', '56 days'), m.stat('Trend weight', 'Held (−0.3%)'), m.stat('Waist', 'No clear change'), m.stat('Strength', 'Up: Back squat, Barbell bench press'),
          m.cap('A tape and a scale cannot measure a pound of muscle. This is the direction of travel, not a measurement of it. Your goal stays as it is unless you change it.')])] })),
        m.frame('coach-metabolism-states', 'Metabolism: settling and implausible', '', m.phone({ cls: 'short', bar: bar, body: [
          m.notice('info', 'Waiting for early water changes to settle. When how much you eat changes, the scale moves a few pounds that are not fat. Your measurement will use the days after October 18, 2026, and needs two weeks of them.'),
          m.notice('caution', 'Your logs and weight trend don’t add up to a plausible number, which usually means food is going unlogged. The estimate is being held at a safe limit.'),
          m.cap('Calorie reductions are paused while your creatine change settles. Safety corrections still apply.')] })),
        m.frame('coach-recovery-states', 'Recovery card: first time and answered', '', m.phone({ cls: 'short', bar: bar, body: [
          m.info('How you are holding up', [m.p('Five quick questions a week on hunger, energy, sleep, training and mood. They are what the food log and the scale cannot see.', 't2'), m.btn('Answer now', 'primary', { sm: true })]),
          m.info('How you are holding up', [m.rowx(['<span class="grow">Hunger</span><span class="t2">3 of 5</span>', m.spark()]), m.btn('Answer again', 'secondary', { sm: true })])] }))
      ] },
      { h: 'Sheets and dialogs', frames: [
        m.frame('target-change-sheet', 'Why your targets are what they are', 'Also shown by itself after a check-in changes targets (target_change_summary_host).', m.phone({ cls: 'short', bar: bar, body: ['<div style="height:620px"></div>'], over: why(false) })),
        m.frame('target-change-none', 'A check-in with no change', '', m.phone({ cls: 'short', bar: bar, body: ['<div style="height:300px"></div>'], over: m.sheet([m.title('Why your targets are what they are'), m.heading('What changed'), m.p('Calories unchanged. Protein target unchanged. Carbohydrate unchanged. Fat unchanged'),
          m.heading('Why'), m.p('No calculated contribution was large enough to move the calorie target.'), m.heading('What would change it'), m.p('If your weight trend changes at this intake, expect targets to follow.', 't2')]) })),
        m.frame('coach-goal-chooser', 'Choose a goal', 'Only the modes the health check allows are offered.', m.phone({ cls: 'short', bar: bar, body: ['<div style="height:420px"></div>'], over: goalDialog(false) }))
      ] },
      { h: 'Target history', id: 'targets-history', frames: [
        m.frame('targets-history', 'Target history', 'Newest first; a row opens its explanation sheet.', m.phone({ cls: 'short', bar: { title: 'Target history', back: true }, body: [m.group([
          m.row('Today', '2,100 kcal · P 131–163 · C 230 · F 58', m.i('right', 's')), m.row('Mon, Sep 28', '2,200 kcal · P 131–165 · C 245 · F 58<br>Kept by you', m.i('right', 's')), m.row('Sep 21', '2,200 kcal · P 131–165 · C 245 · F 58', m.i('right', 's'))])] })),
        m.frame('targets-history-empty', 'No targets yet', '', m.phone({ cls: 'short', bar: { title: 'Target history', back: true }, body: [m.p('No targets yet.', 't2')] }))
      ] },
      { h: 'Monthly report', id: 'monthly-report', frames: [
        m.frame('monthly-report', 'A month’s report', 'MM-33. What you did comes first; the scale second.', m.phone({ bar: { title: 'Sep 6 – Oct 5', back: true }, body: [
          m.info('What you did', [m.stat('Days logged', '30 of 30'), m.stat('Whole days', '26'), m.stat('Weigh-ins', '28'), m.stat('Workouts', '9'), m.stat('Average protein', '156 g against a target of 163 g')]),
          m.info('What your body did', [m.stat('Trend weight', '−5.5 lb'), m.stat('Waist', '36.6 in to 35.8 in (down 0.8 in)')]),
          m.info('Your lifts', [m.stat('Back squat', '303.0 lb to 319.7 lb (+16.7 lb)'), m.stat('Barbell bench press', '205.0 lb to 212.5 lb (+7.5 lb)'),
            m.cap('Estimated one-rep max, smoothed over recent sessions, at the first and the last session of the month. It is worked out from reps and load, not tested.')]),
          m.info('What the coach measured', [m.p('2,640 kcal a day, give or take 95.')]),
          m.info('Changes to your targets', [m.p('Sep 28: 2,300 kcal to 2,200 kcal. Based on an expenditure estimate of 2,740 kcal a day, give or take 120 (measured).'), m.p('Oct 5: 2,200 kcal to 2,100 kcal. Based on an expenditure estimate of 2,640 kcal a day, give or take 95 (measured).')])] })),
        m.frame('monthly-report-thin', 'A thin month', '', m.phone({ cls: 'short', bar: { title: 'Aug 7 – Sep 5', back: true }, body: [
          m.info('What your body did', [m.stat('Trend weight', 'Too few weigh-ins to say')]), m.info('Your lifts', [m.stat('Estimated maxes', 'No lift had two sessions this month')]),
          m.info('What the coach measured', [m.p('Not measured this month: only 6 whole days were logged, and the coach needs at least 14 to tell your expenditure from the scale.')]),
          m.info('Changes to your targets', [m.p('Your targets did not change this month.')])] })),
        m.frame('monthly-report-not-ready', 'Not ready', '', m.phone({ cls: 'short', bar: { title: 'Monthly report', back: true }, body: [m.p('This report is not ready yet.', 't2')] }))
      ] },
      { h: 'Weekly recovery check-in', id: 'recovery-check-in', frames: [
        m.frame('recovery-check-in', 'This week', 'MM-116. Five answers from 1 to 5; sleep hours are optional.', m.phone({ bar: { title: 'This week', back: true }, body: [
          m.p('Five quick ones on how you are holding up. There are no right answers, and they never lower a target.', 't2')].concat(
          [['How was hunger this week?', 'Constant', 'Manageable'], ['How was your energy through the day?', 'Drained', 'Steady'], ['How well did you sleep?', 'Poor', 'Sound'], ['How did training feel?', 'A slog', 'Strong'], ['How was your mood?', 'Irritable', 'Even']].map(function (q, n) {
            return m.col([m.label(q[0]), m.seg(['1', '2', '3', '4', '5'], n < 3 ? 2 + (n % 2) : -1), m.rowx(['<span class="cap grow">' + q[1] + '</span><span class="cap">' + q[2] + '</span>'])]);
          })).concat([m.label('Typical hours of sleep (optional)'), m.field('', '7', { cls: 'oncanvas' }), m.btn('Save', 'off', { block: true })]) }))
      ] }
    ]
  });
})(mm);
</script>
</body>
</html>
