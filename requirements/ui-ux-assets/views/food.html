<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food · Martian Macros UI reference</title>
<link rel="stylesheet" href="../shared/mm.css">
<script src="../shared/mm.js"></script>
</head>
<body>
<script>
(function (m) {
  var bar = { title: 'Today', day: true, dayEnd: true, acts: ['gear'] };
  var hero = m.hero({ pct: 27, fig: '1,534', cap: 'kcal left of 2,100', parts: [m.macros()] });
  var split = m.info('Macronutrient split', [
    m.rowx([m.donut(), m.col(['<div class="c-protein"><b>Protein</b><br>40 g · 28.3%</div>', '<div class="c-carbs"><b>Carbs</b><br>61 g · 43.1%</div>', '<div class="c-fat"><b>Fat</b><br>18 g · 28.6%</div>'])]),
    m.cap('566 kcal from recorded macros · protein/carbs 4 kcal/g, fat 9 kcal/g. Alcohol and other calorie differences are not part of this split.')]);
  function meal(name, kcal, entries, open) {
    var head = '<div class="rowx" data-disc-host><div class="grow"><div class="heading" style="font-size:15px">' + name + '</div>' + (kcal ? '<div class="t2" style="font-size:13px">' + kcal + '</div>' : '') + '</div>' +
      m.icobtn('plus', 'Add food to ' + name.toLowerCase(), { cls: 'add', s: true }) + m.icobtn(open ? 'up' : 'down', 'Show or hide ' + name, { disc: true, s: true }) + '</div>';
    return '<div class="card">' + head + '<div class="col" ' + (open ? '' : 'hidden') + '>' + (entries || '') + '</div></div>';
  }
  function entry(name, macros, src, kcal) {
    return m.hr() + m.rowx(['<div class="grow"><div>' + name + '</div><div class="t2" style="font-size:13px">' + macros + '</div><div class="t3" style="font-size:13px">' + src + '</div></div><div class="heading">' + kcal + '</div>']);
  }
  var meals = [
    meal('Breakfast', '566 kcal · 40 g protein', entry('Demo oats and yogurt', 'P 40 · C 61 · F 18', 'Weighed · amount not recorded', '566'), true),
    meal('Lunch', '', '', true), meal('Dinner', '', '', true), meal('Snacks', '', '', true)];
  var complete = m.col([m.heading('Is this day fully logged?'), m.seg(['Complete', 'Partial'], 1, { check: true }),
    m.cap('Partial days are left out of your metabolism estimate instead of being read as under-eating.')]);

  m.page({
    title: 'Food',
    intro: 'The day’s food log: the calorie hero, the macro split, the four meals and whether the day is fully logged. Adding and editing food is on the Add food sheet.',
    sources: ['apps/mobile/lib/src/food/food_screen.dart', 'apps/mobile/lib/src/food/meal_section.dart', 'apps/mobile/lib/src/food/food_entry_tile.dart', 'apps/mobile/lib/src/food/calorie_hero.dart', 'apps/mobile/lib/src/food/fiber_line.dart', 'apps/mobile/lib/src/food/easy_to_miss_line.dart', 'apps/mobile/lib/src/food/ask_low_day_complete.dart'],
    tickets: ['MM-38', 'MM-40', 'MM-41', 'MM-47', 'MM-48', 'MM-49', 'MM-125', 'MM-126', 'MM-127', 'MM-152'],
    limits: 'Swipe-to-delete on an entry is described, not animated. Tap a meal’s chevron to collapse it.',
    sections: [
      { h: 'Default', frames: [
        m.frame('food-default', 'Today, one entry', 'Hero, split, meals expanded, completeness.', m.phone({ bar: bar, nav: 'food', fab: 'Add food', body: [hero, split].concat(meals).concat([complete]) })),
        m.frame('food-meals-collapsed', 'Meals collapsed', 'Each meal keeps its total while collapsed.', m.phone({ cls: 'short', bar: bar, nav: 'food', body: [
          meal('Breakfast', '566 kcal · 40 g protein', '', false), meal('Lunch', '', '', false), meal('Dinner', '', '', false), meal('Snacks', '', '', false)] }))
      ] },
      { h: 'Other states', frames: [
        m.frame('food-empty', 'Nothing logged', 'Copy yesterday is offered when yesterday has entries.', m.phone({ cls: 'short', bar: bar, nav: 'food', fab: 'Add food', body: [
          m.hero({ pct: 0, fig: '2,100', cap: 'kcal left of 2,100', parts: [m.macros({ protein: '0 g · min 131 · target 163', carbs: '0 / 230 g', fat: '0 / 58 g', pcts: [0, 0, 0] })] }),
          m.p('Nothing logged yet. Start with breakfast.', 't2'), m.btn('Copy yesterday', 'secondary', { icon: 'copy' })] })),
        m.frame('food-past-day', 'A past day', 'The day stepper moves back and forward; forward stops at today. A past meal can be copied to today.', m.phone({ cls: 'short', bar: { title: 'Yesterday', day: true, acts: ['gear'] }, nav: 'food', body: [
          '<div class="card"><div class="rowx"><div class="grow"><div class="heading" style="font-size:15px">Dinner</div><div class="t2" style="font-size:13px">720 kcal · 48 g protein</div></div>' +
          m.icobtn('copy', 'Copy dinner to today', { s: true }) + m.icobtn('plus', 'Add food to dinner', { cls: 'add', s: true }) + m.icobtn('up', 'Hide dinner', { s: true }) + '</div>' +
          entry('Chicken thigh, roasted', 'P 48 · C 0 · F 22', 'USDA, lab-analyzed · 220 g weighed', '390') + entry('Rice, cooked', 'P 6 · C 72 · F 1', 'Cup / spoon · 1.5 cups', '330') + '</div>'] })),
        m.frame('food-detail-full', 'Full detail level', 'Fiber and alcohol lines appear under the split when the detail level is Full (MM-49).', m.phone({ cls: 'short', bar: bar, body: [split, m.p('Fiber: 18 g · guide 30 g', 't2'), m.p('Alcohol: 98 kcal', 't2')] })),
        m.frame('food-complete', 'Marked complete', 'With the easy-to-miss line on (Settings), a complete day names things people forget.', m.phone({ cls: 'short', bar: bar, body: [
          m.col([m.heading('Is this day fully logged?'), m.seg(['Complete', 'Partial'], 0, { check: true })]),
          m.rowx(['<span class="t2">Easy to miss</span>', '<span class="chip">cooking oil</span>', '<span class="chip">bites and tastes</span>'], 'wrap')] })),
        m.frame('food-low-day', 'A very low day marked complete', 'Dialog from ask_low_day_complete.dart.', m.phone({ cls: 'short', bar: bar, body: [complete, '<div style="height:220px"></div>'],
          over: m.dialog('Is this everything you ate today?', '640 kcal is logged. If food is missing, mark the day partial so the coach does not read it as a full day.', [m.btn('Mark partial', 'text', { hide: true }), m.btn('Yes', 'primary', { hide: true, sm: true })]) })),
        m.frame('food-removed', 'An entry removed', 'Swiping an entry away removes it and offers Undo.', m.phone({ cls: 'short', bar: bar, nav: 'food', body: [meal('Breakfast', '', '', true), '<div style="height:120px"></div>'], over: m.snack('Removed Demo oats and yogurt', 'Undo') })),
        m.frame('food-paused', 'While paused', '', m.phone({ cls: 'short', bar: bar, body: [m.hero({ pct: 22, fig: '566', cap: 'kcal logged · paused, guide 2,600', parts: [m.macros({ noMark: true })] })] })),
        m.frame('food-error', 'Pause history could not be loaded', '', m.phone({ cls: 'short', bar: bar, body: [m.notice('caution', 'Pause history could not be loaded. Reopen the app to retry.')] }))
      ] }
    ]
  });
})(mm);
</script>
</body>
</html>
