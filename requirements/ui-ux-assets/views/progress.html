<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress · Martian Macros UI reference</title>
<link rel="stylesheet" href="../shared/mm.css">
<script src="../shared/mm.js"></script>
</head>
<body>
<script>
(function (m) {
  var bar = { title: 'Progress', acts: ['gear'] };
  function weigh(value, hint, on) {
    return m.info('Today’s weigh-in', [m.rowx(['<div class="grow">' + m.field('', value, { sfx: 'lb' }) + '</div>', m.btn('Save', on ? 'primary' : 'off')]),
      m.cap(hint || 'First thing in the morning, after the bathroom.')]);
  }
  function stats() {
    return m.rowx(['Trend weight|184.1 lb', 'Last 7 days|−0.6 lb', 'Since start|−5.5 lb'].map(function (s) {
      var p = s.split('|');
      return '<div class="grow"><div class="label t2">' + p[0] + '</div><div class="fig" style="font-size:20px;line-height:28px">' + p[1] + '</div></div>';
    }), 'top');
  }
  var legend = m.p('Dots are weigh-ins. The line is your trend with water swings filtered out; the band is its uncertainty. Daily jumps inside the band are noise, not fat. Dashed markers show recorded weight events.', 't2');
  var trend = m.info('Weight trend', [stats(), m.trend({ event: true }), legend], m.seg(['30d', '90d'], 0, { fit: true }));
  var events = m.info('Weight events', [
    m.p('If you start or stop creatine later, add an event here.', 't2'),
    m.row('2026-09-21 · Travel', 'Scale noise widened around this event.', m.icobtn('trash', 'Delete travel event', { s: true }), { cls: 'bare' }),
    m.row('2026-09-01 · Started creatine', 'Creatine shift estimated across 21 days. Onboarding', '', { cls: 'bare' })
  ], m.btn('Add', 'secondary', { icon: 'plus', sm: true, show: 'event' }));
  function waist(vals, summary) {
    return m.info('Waist', [m.rowx(['1st', '2nd', '3rd'].map(function (l, n) { return '<div class="grow">' + m.field(l, vals[n]) + '</div>'; })),
      m.rowx(['<span class="cap grow">Take three readings in inches. The middle one is kept.</span>', m.btn('Save', vals[0] ? 'primary' : 'off')]),
      m.p(summary, 't2'),
      m.cap('First thing in the morning, after the bathroom, before eating. Stand relaxed and breathe out normally. Keep the tape level with the navel, snug and not pressing in, and use the same tape each time. Once a week is enough.')]);
  }
  var recomp = m.info('Recomp signal', [m.p('Trend weight held near 184.1 lb. Waist down about 0.8 in. Estimated maxes are up on Back squat and Barbell bench press. This pattern is consistent with losing fat while keeping or gaining muscle. It does not measure either.')]);
  var strengthHead = m.info('Strength trends', [m.p('Your most-trained lifts over the last 90 days. Each point comes from a finished workout.'), m.btn('All lift histories', 'secondary')]);
  var lift = m.info('Back squat', [
    '<div><div class="fig" style="font-size:26px">319.7 lb</div><div class="cap">Smoothed e1RM · October 5, 2026</div></div>',
    m.rowx(['<span>4 weeks: +16.8 lb</span>', '<span>12 weeks: +50.3 lb</span>']),
    '<p class="cap">– – Session best e1RM &nbsp; <span class="c-ion">● Smoothed e1RM</span></p>', m.lineChart(),
    m.cap('Estimated one-rep max is a comparison tool, not a prediction of a real max. The line averages up to 3 recent sessions. Changes end at the latest qualifying session.'),
    m.btn('Session history', 'secondary')]);
  var eventSheet = function (hidden) {
    return m.sheet([m.title('Add a weight event'),
      m.field('Event', 'Travel', { sfx: m.i('down', 's') }), m.row('Date', '2026-10-05', m.i('cal', 's'), { cls: 'bare' }), m.cap('Events can be added for the last 28 days.'),
      m.rowx([m.btn('Cancel', 'text', { hide: true }), '<span class="grow"></span>', m.btn('Save event', 'primary', { hide: true })])], { id: 'event', hidden: hidden });
  };

  m.page({
    title: 'Progress',
    intro: 'Weigh-in, the weight trend with its uncertainty, weight events, the waist, the recomp signal and strength trends. Lift histories open from here.',
    sources: ['apps/mobile/lib/src/progress/', 'apps/mobile/lib/src/charts/trend_chart.dart', 'apps/mobile/lib/src/charts/trend_stats.dart', 'apps/mobile/lib/src/ui/strength_trend_card.dart', 'apps/mobile/lib/src/ui/number_entry_card.dart'],
    tickets: ['MM-16', 'MM-17', 'MM-21', 'MM-136', 'MM-155', 'MM-32', 'MM-77', 'MM-71', 'MM-107'],
    limits: 'Charts are schematic, not plotted from data. The order of text inside the Waist card is approximate.',
    sections: [
      { h: 'Progress', frames: [
        m.frame('progress-default', 'With a month of weigh-ins', 'Tap Add on Weight events to open the sheet.', m.phone({ bar: bar, nav: 'progress', body: [weigh('183.9'), trend, events,
          waist(['', '', ''], 'Latest: 35.8 in on Oct 4. Down 0.8 in since you started. Weekly is enough: the next is due Oct 11.'), recomp, strengthHead, lift], over: eventSheet(true) })),
        m.frame('progress-empty', 'Nothing recorded yet', '', m.phone({ bar: bar, nav: 'progress', body: [weigh(''), m.info('Weight trend', [m.p('Log a weigh-in to start your trend.', 't2')], m.seg(['30d', '90d'], 0, { fit: true })),
          m.info('Weight events', [m.p('Note illness, travel, training changes, meals, or creatine to help separate water changes from tissue change. If you start or stop creatine later, add an event here.', 't2')], m.btn('Add', 'secondary', { icon: 'plus', sm: true })),
          waist(['', '', ''], 'Enter one reading or all three.'), m.info('Strength trends', [m.p('Finish a workout in Train to start your strength history.', 't2')])] }))
      ] },
      { h: 'States of its cards', frames: [
        m.frame('progress-weigh-in-typed', 'A weigh-in being typed', 'Save turns on once the value differs from what is stored.', m.phone({ cls: 'short', bar: bar, body: [weigh('183.4', null, true)] })),
        m.frame('progress-weigh-in-imported', 'A weigh-in read from Health Connect', 'MM-71: the hint says where it came from; typing overrules it.', m.phone({ cls: 'short', bar: bar, body: [weigh('183.9', 'From Bathroom scale at 6:42 AM. Type a value to use yours instead.')] })),
        m.frame('progress-trend-few', 'Too few weigh-ins for a trend', '', m.phone({ cls: 'short', bar: bar, body: [m.info('Weight trend', [stats(), m.p('A trend needs more weigh-ins.', 't2'), legend], m.seg(['30d', '90d'], 0, { fit: true }))] })),
        m.frame('progress-waist-entry', 'Waist: three readings', '', m.phone({ cls: 'short', bar: bar, body: [waist(['35.9', '35.8', '35.6'], 'Latest: 36.6 in on Sep 27. No clear change since you started: a difference under 0.6 in is within what a tape can tell.')] })),
        m.frame('progress-waist-one', 'Waist: one reading', '', m.phone({ cls: 'short', bar: bar, body: [m.info('Waist', [m.rowx(['<div class="grow">' + m.field('1st', '35.8') + '</div>', '<div class="grow">' + m.field('2nd', '') + '</div>', '<div class="grow">' + m.field('3rd', '') + '</div>']),
          m.rowx(['<span class="cap grow">One reading is kept as it is. It is noisier than the middle of three, so a change takes longer to show.</span>', m.btn('Save', 'primary')])])], over: m.snack('That value looks off. Check it.') })),
        m.frame('progress-recomp-close', 'Close to a recomp signal', 'Two of three parts present.', m.phone({ cls: 'short', bar: bar, body: [m.info('Close to a recomp signal', [m.p('Your trend weight is holding and your lifts are going up. Measure your waist once a week to see whether it is coming down too.')])] })),
        m.frame('progress-event-sheet', 'Add a weight event', 'Kinds: Started creatine, Stopped creatine, Illness, Travel, New or harder training, Unusually large or salty meal, Other.', m.phone({ cls: 'short', bar: bar, body: ['<div style="height:260px"></div>'], over: eventSheet(false) })),
        m.frame('progress-events-third', 'A third event in two weeks', '', m.phone({ cls: 'short', bar: bar, body: [m.info('Weight events', [m.row('2026-10-03 · Illness', 'Recorded only; two other events in this 14-day window already affect the trend.', m.icobtn('trash', 'Delete illness event', { s: true }), { cls: 'bare' })])] })),
        m.frame('progress-strength-states', 'Strength: loading, error, no estimate', '', m.phone({ cls: 'short', bar: bar, body: [
          m.info('Strength trends', [m.spinner()]),
          m.info('Strength trends', [m.p('Could not load strength history. Your logged sets are not changed.', 't2'), m.btn('Retry strength history', 'secondary')]),
          m.info('Pull-up', [m.p('No usable estimate yet. Log a finished workout with positive resistance and at most 12 reps including reps in reserve. RIR 5+ is not an exact count.', 't2'),
            m.cap('Uses total bodyweight plus added or assisted weight. A weigh-in on or before each session, no more than 7 days old, is required.'), m.btn('Session history', 'secondary')]),
          m.info('Deleted exercise', [m.p('Exercise details were deleted. Logged sets are preserved, but estimates need the original resistance type.', 't2')])] }))
      ] },
      { h: 'Lift histories', id: 'lifts', frames: [
        m.frame('strength-lifts', 'Lift histories', 'Every lift ever logged.', m.phone({ cls: 'short', bar: { title: 'Lift histories', back: true }, body: [m.info('Every logged lift', [
          m.row('Back squat', '12 logged sessions · 12 qualifying', m.i('right', 's'), { cls: 'bare' }), m.row('Barbell bench press', '11 logged sessions · 10 qualifying', m.i('right', 's'), { cls: 'bare' }), m.row('Plank', '4 logged sessions · 0 qualifying', m.i('right', 's'), { cls: 'bare' })])] })),
        m.frame('strength-lifts-empty', 'No finished workouts', '', m.phone({ cls: 'short', bar: { title: 'Lift histories', back: true }, body: [m.info('Every logged lift', [m.p('No finished workouts yet.', 't2')])] })),
        m.frame('strength-history', 'Lift history', 'One lift, titled with its name: its trend card, then every qualifying session.', m.phone({ bar: { title: 'Back squat', back: true }, body: [lift.replace(m.btn('Session history', 'secondary'), ''), m.info('Qualifying sessions', [
          m.row('October 5, 2026', 'Best set e1RM 323.9 lb · smoothed 319.7 lb', '', { cls: 'bare' }), m.row('September 28, 2026', 'Best set e1RM 319.7 lb · smoothed 315.6 lb', '', { cls: 'bare' }),
          m.cap('Chart points use the latest qualifying session on each date. Every qualifying session is listed above. RIR not recorded counts as 0; sets above 12 effective reps and RIR 5+ are excluded.')])] })),
        m.frame('strength-history-empty', 'No sessions, or none qualifying', '', m.phone({ cls: 'short', bar: { title: 'Lift history', back: true }, body: [m.info('No sessions', [m.p('This lift no longer has logged sessions.', 't2')]), m.info('Qualifying sessions', [m.p('No qualifying sessions yet.', 't2')])] }))
      ] }
    ]
  });
})(mm);
</script>
</body>
</html>
