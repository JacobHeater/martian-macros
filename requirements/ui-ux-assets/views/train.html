<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train · Martian Macros UI reference</title>
<link rel="stylesheet" href="../shared/mm.css">
<script src="../shared/mm.js"></script>
</head>
<body>
<script>
(function (m) {
  var bar = { title: 'Train', acts: ['gear'] };
  var wbar = { title: 'Workout', back: true, acts: ['trash'] };
  function clock(o) {
    o = o || {};
    return m.card([m.rowx(['<div class="grow"><div class="fig" style="font-size:22px;line-height:28px">' + (o.time || '38:00') + '</div><div class="t2">' + (o.sub || 'Started 11:22 AM') + '</div></div>',
      o.done ? '' : m.btn(o.paused ? 'Resume' : 'Pause', 'secondary', { icon: o.paused ? 'play' : 'pause' })]), m.btn('Edit times', 'text', { sm: true }).replace('class="btn', 'style="align-self:flex-start" class="btn')]);
  }
  function setRow(text, n, time) { return m.row(text, '', '<span class="cap">Set ' + n + (time ? ' · ' + time : '') + '</span>', { cls: 'bare' }); }
  function editor(n, o) {
    o = o || {};
    return m.col([m.label('Set ' + n), m.stepper('Reps', o.reps || '8'), m.stepper(o.loadLabel || 'Load', o.load || '225', 'lb'), o.loadHelp ? m.cap(o.loadHelp) : '',
      m.cap('Reps in reserve (optional)'), m.seg(['0', '1', '2', '3', '4', '5+'], o.rir == null ? -1 : o.rir),
      m.row('Started', o.started || 'Not timed', m.i('right', 's'), { cls: 'bare', show: 'clock' }), m.row('Ended', o.ended || 'Not timed', m.i('right', 's'), { cls: 'bare', show: 'clock' }),
      o.remove ? m.btn('Remove set', 'text', { sm: true }) : '']);
  }
  function exercise(name, parts) {
    return m.card([m.rowx(['<div class="heading grow">' + name + '</div>', m.icobtn('close', 'Remove exercise', { show: 'remove' })])].concat(parts));
  }
  var squat = exercise('Back squat', [
    m.cap('Last time: 8 × 225 lb · 2 RIR, 7 × 225 lb · 1 RIR'), m.p('Matching last time holds your strength while you lose fat.'),
    setRow('8 × 225 lb · 2 RIR', 1), editor(2),
    m.row('Suggestions use', '6 to 10 reps · 5 lb steps', m.i('right', 's'), { cls: 'bare' }), m.row('Rest target', '2:00', m.i('right', 's'), { cls: 'bare', show: 'rest' }),
    m.btn('Add set', 'secondary', { block: true })]);
  function timer(labelText, time, action, kind, note) {
    return '<div class="bottom"><div class="grow"><div class="cap">' + labelText + '</div><div class="fig" style="font-size:22px;line-height:28px">' + time + '</div>' + (note ? '<div class="cap">' + note + '</div>' : '') + '</div>' + m.btn(action, kind) + '</div>';
  }
  var clockDialog = function (hidden, err) {
    return '<div class="scrim mid" data-layer="clock"' + (hidden ? ' hidden' : '') + '><div class="dialog"><div class="heading">Set started</div>' +
      m.rowx(['<div class="grow">' + m.field('Hour', '11') + '</div>', '<div class="grow">' + m.field('Min', err ? '75' : '41', { err: err }) + '</div>', '<div class="grow">' + m.field('Sec', '05') + '</div>']) +
      (err ? '<div class="helper err">The minute is from 0 to 59.</div>' : '') + m.seg(['AM', 'PM'], 0) + '<div class="acts">' + m.btn('Cancel', 'text', { hide: true }) + m.btn('OK', 'primary', { hide: true, sm: true }) + '</div></div></div>';
  };
  var restMenu = function (hidden) {
    return '<div class="scrim mid" data-layer="rest"' + (hidden ? ' hidden' : '') + '><div class="dialog"><div class="heading">Rest target</div>' +
      ['None', '1:00', '1:30', '2:00', '3:00', '5:00'].map(function (t) { return '<div class="row bare" data-hide role="button" tabindex="0"><div class="main">' + t + '</div>' + (t === '2:00' ? '<div class="trail" aria-label="Chosen">' + m.i('check', 's') + '</div>' : '') + '</div>'; }).join('') + '</div></div>';
  };

  m.page({
    title: 'Train',
    intro: 'The training log: the Train destination, a workout logged set by set with its clock and timers, choosing and creating exercises, the suggestion range, weekly volume and workout times.',
    sources: ['apps/mobile/lib/src/train/', 'apps/mobile/lib/src/ui/muscle_volume_row.dart', 'apps/mobile/lib/src/ui/mm_clock_time_dialog.dart', 'apps/mobile/lib/src/ui/show_mm_options.dart'],
    tickets: ['MM-75', 'MM-76', 'MM-78', 'MM-79', 'MM-191', 'MM-92', 'MM-77'],
    limits: 'The phone’s own date and time pickers are not drawn. Timers do not run. The vibration at the end of a rest cannot be shown.',
    sections: [
      { h: 'Train', frames: [
        m.frame('train-default', 'With a workout history', '', m.phone({ cls: 'short', bar: bar, nav: 'train', body: [
          m.btn('Start workout', 'primary', { block: true }), m.btn('Repeat last workout', 'secondary', { block: true }), m.btn('Weekly training volume', 'secondary', { block: true }),
          m.info('Workouts', [m.row('Sat, Oct 3', '2 exercises · 3 sets · 52 min · 1 personal record', m.i('right', 's'), { cls: 'bare' }), m.row('Wed, Sep 30', '2 exercises · 3 sets · 52 min', m.i('right', 's'), { cls: 'bare' })])] })),
        m.frame('train-empty', 'No workouts yet', '', m.phone({ cls: 'short', bar: bar, nav: 'train', body: [
          m.p('Log your training here, set by set. Strength is one of the three things the app watches, with your weight trend and your waist.', 't2'), m.btn('Start workout', 'primary', { block: true }), m.btn('Weekly training volume', 'secondary', { block: true })] })),
        m.frame('train-in-progress', 'A workout in progress', '', m.phone({ cls: 'short', bar: bar, nav: 'train', body: [m.info('Workout in progress', [m.p('2 exercises · 2 sets', 't2'), m.btn('Continue', 'primary')])] }))
      ] },
      { h: 'Workout', id: 'workout', frames: [
        m.frame('workout-default', 'Logging a set', 'Tap Started or Ended for the time dialog, Rest target for its options, the cross to remove the exercise.', m.phone({ bar: wbar, body: [m.p('2 exercises · 2 sets', 't2'), clock(), squat,
          exercise('Romanian deadlift', [m.cap('Last time: 10 × 185 lb · 2 RIR'), m.p('One more rep on any set would be a step up.'), setRow('10 × 185 lb · 2 RIR', 1, '0:48'), m.btn('Add set', 'secondary', { block: true })]),
          m.btn('Add exercise', 'secondary', { block: true }), m.btn('Finish workout', 'primary', { block: true })],
          bottom: timer('Rest', '0:00', 'Start set', 'primary'),
          over: [clockDialog(true), restMenu(true), m.confirm('Remove this exercise?', 'Its sets in this workout are removed with it.', 'Remove', { id: 'remove', hidden: true })] })),
        m.frame('workout-empty', 'A new workout', '', m.phone({ cls: 'short', bar: wbar, body: [clock({ time: '0:12', sub: 'Started 11:22 AM' }), m.p('Add the first exercise. Each set is one tap once the first is in.', 't2'), m.btn('Add exercise', 'secondary', { block: true }), m.btn('Finish workout', 'off', { block: true })] })),
        m.frame('workout-finished', 'A finished workout', 'Opened from the Workouts list. Records are estimated one-rep-max bests.', m.phone({ cls: 'short', bar: { title: 'Workout, Sat, Oct 3', back: true, acts: ['trash'] }, body: [
          m.p('2 exercises · 3 sets · 52 min · 1 personal record', 't2'), clock({ time: '52:00', sub: '11:22 AM to 12:14 PM', done: true }),
          m.info('Personal record', [m.p('Back squat: estimated max 322.0 lb, up from 317.5 lb.'), m.cap('Your best estimated one-rep max on the lift so far, worked out from reps and load.')]),
          exercise('Back squat', [setRow('8 × 225 lb · 2 RIR', 1, '0:52'), setRow('8 × 230 lb · 1 RIR', 2, '0:55'), m.btn('Add set', 'secondary', { block: true })])] }))
      ] },
      { h: 'Workout: clock, timers and suggestions', frames: [
        m.frame('workout-paused', 'Paused', '', m.phone({ cls: 'short', bar: wbar, body: [clock({ paused: true, time: '38:00', sub: 'Paused<br>Paused for 4:10' })], bottom: timer('Paused', '0:00', 'Start set', 'off') })),
        m.frame('workout-set-running', 'A set being timed', '', m.phone({ cls: 'short', bar: wbar, body: [m.p('Tap Add set when the set is done.', 't2')], bottom: timer('Set', '0:23', 'Cancel', 'secondary') })),
        m.frame('workout-rest-counting', 'Rest counting down to a target', '', m.phone({ cls: 'short', bar: wbar, body: ['<div style="height:40px"></div>'], bottom: timer('Rest left · 2:00 target', '1:12', 'Start set', 'primary') })),
        m.frame('workout-rest-reached', 'Target rest reached', 'The phone vibrates once.', m.phone({ cls: 'short', bar: wbar, body: ['<div style="height:40px"></div>'], bottom: timer('Target rest reached · 2:00 target', '2:07', 'Start set', 'primary') })),
        m.frame('workout-suggestions', 'The four suggestions', 'MM-79. A suggestion is a sentence, never a prefilled number.', m.phone({ cls: 'short', bar: wbar, body: [
          m.card([m.p('One more rep on any set would be a step up.')]), m.card([m.p('Every set reached 10 last time. A step up would be 230 lb × 6.')]),
          m.card([m.p('No more reps at this load in three sessions. Holding 225 lb × 8 is a fair aim.')]), m.card([m.p('Matching last time holds your strength while you lose fat.')])] })),
        m.frame('workout-bodyweight-set', 'A bodyweight exercise', 'The load is what is added; below zero is assistance.', m.phone({ cls: 'short', bar: wbar, body: [exercise('Pull-up', [editor(1, { loadLabel: 'Added weight', load: '-20', loadHelp: 'Below zero for assisted work', rir: 2, started: '11:41:05 AM', ended: '11:41:50 AM', remove: true })])] })),
        m.frame('workout-clock-dialog', 'Setting a time by hand', '', m.phone({ cls: 'short', bar: wbar, body: ['<div style="height:300px"></div>'], over: clockDialog(false) })),
        m.frame('workout-clock-invalid', 'A time that cannot be', 'Also refused, as a message: “The end has to be after the start.”, “That is before the workout started.”, “That is after the workout, or still to come.”, “That overlaps another set in this workout.”',
          m.phone({ cls: 'short', bar: wbar, body: ['<div style="height:320px"></div>'], over: clockDialog(false, true) })),
        m.frame('workout-rest-menu', 'Choosing a rest target', '', m.phone({ cls: 'short', bar: wbar, body: ['<div style="height:380px"></div>'], over: restMenu(false) })),
        m.frame('workout-delete', 'Deleting a workout', '', m.phone({ cls: 'short', bar: wbar, body: ['<div style="height:240px"></div>'], over: m.confirm('Delete this workout?', 'Its exercises and sets are deleted with it.', 'Delete') }))
      ] },
      { h: 'Choosing and creating an exercise', id: 'exercises', frames: [
        m.frame('exercise-picker', 'Choose an exercise', '', m.phone({ bar: { title: 'Choose an exercise', back: true }, body: [m.field('Search exercises', '', { cls: 'oncanvas' }), m.gh('Recent'),
          m.row('Back squat', 'Barbell · Quads', '', { cls: 'bare' }), m.row('Romanian deadlift', 'Barbell · Hamstrings', '', { cls: 'bare' }), m.gh('All exercises'),
          m.row('Ab wheel rollout', 'Other · Abs', '', { cls: 'bare' }), m.row('Arnold press', 'Dumbbell · Shoulders', '', { cls: 'bare' }), m.row('Assisted pull-up', 'Machine · Back', '', { cls: 'bare' }),
          m.row('Back extension', 'Bodyweight · Back', '', { cls: 'bare' }), m.row('Sled push', 'Other · Quads · Yours', '', { cls: 'bare' })] })),
        m.frame('exercise-picker-none', 'No match', '', m.phone({ cls: 'short', bar: { title: 'Choose an exercise', back: true }, body: [m.field('Search exercises', 'zercher', { cls: 'oncanvas' }), m.p('No exercise by that name.', 't2'), m.btn('Create your own exercise', 'secondary')] })),
        m.frame('custom-exercise', 'Your own exercise', '', m.phone({ cls: 'short', bar: { title: 'Your own exercise', back: true }, body: [
          m.field('Name', 'Zercher squat', { cls: 'oncanvas' }), m.field('Equipment', 'Barbell', { cls: 'oncanvas', sfx: m.i('down', 's') }), m.field('Main muscle group', 'Quads', { cls: 'oncanvas', sfx: m.i('down', 's') }),
          m.label('Also trains (optional)'), m.chips(['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms', 'Abs', 'Glutes', 'Hamstrings', 'Calves'], [6, 7], { multi: true }),
          m.label('What the load you log means'), m.seg(['The weight moved', 'Added to bodyweight'], 0), m.btn('Save exercise', 'primary', { block: true })] })),
        m.frame('progression-settings', 'Suggestions', 'The rep range and load step a lift’s suggestions use.', m.phone({ cls: 'short', bar: { title: 'Suggestions', back: true }, body: [
          m.p('A suggestion adds reps within this range until every set reaches the top, then adds one load step and goes back to the bottom. These are yours to set; no range is the right one.', 't2'),
          m.rowx(['<div class="grow">' + m.field('Fewest reps', '6', { cls: 'oncanvas' }) + '</div>', '<div class="grow">' + m.field('Most reps', '10', { cls: 'oncanvas' }) + '</div>']),
          m.field('Load step', '', { cls: 'oncanvas', sfx: 'lb', help: 'Leave empty for the usual step: 5 lb.' }), m.btn('Save', 'primary', { block: true }), m.btn('Use the defaults', 'text', { block: true })] })),
        m.frame('progression-settings-invalid', 'A range that cannot be', 'One message at a time: “Enter both ends of the range.”, “The fewest reps is at least 1.”, “The most reps is at most 50.”, “The load step is a number above zero, or left empty.”', m.phone({ cls: 'short', bar: { title: 'Suggestions', back: true }, body: [
          m.rowx(['<div class="grow">' + m.field('Fewest reps', '10', { cls: 'oncanvas' }) + '</div>', '<div class="grow">' + m.field('Most reps', '8', { cls: 'oncanvas', err: true }) + '</div>']), '<div class="helper err">The most reps has to be more than the fewest.</div>', m.btn('Save', 'primary', { block: true })] }))
      ] },
      { h: 'Weekly training volume', id: 'weekly-volume', frames: [
        m.frame('weekly-volume', 'Weekly training volume', 'MM-78.', m.phone({ bar: { title: 'Weekly training volume', back: true }, body: [
          m.info('Last seven days', [m.p('September 29, 2026 – October 5, 2026<br>Previous: September 22, 2026 – September 28, 2026'),
            m.p('Finished workouts only. Hard sets have RIR 0–4 or no RIR recorded. Primary muscles count fully; secondary muscles count half.'),
            m.p('The shaded 10–20 range is a typical weekly reference, not a rule or a target for every muscle. The thin marker shows your previous seven days.')]),
          m.info('Hard sets by muscle group', [['Chest', 2, 2], ['Back', 4, 4], ['Shoulders', 2, 2], ['Biceps', 2, 2], ['Quads', 6, 4]].map(function (g) {
            return m.col(['<div><b>' + g[0] + '</b> &nbsp; <b>' + g[1] + ' hard sets</b></div>', m.cap('Previous: ' + g[2] + ' · change: ' + (g[1] - g[2] > 0 ? '+' : '') + (g[1] - g[2])), m.vol(g[1] * 5, g[2] * 5)], 'gap4');
          }))] })),
        m.frame('weekly-volume-states', 'Loading, unreadable, and unmapped sets', '', m.phone({ cls: 'short', bar: { title: 'Weekly training volume', back: true }, body: [m.spinner(),
          m.info('Volume unavailable', [m.p('Could not read training history. Your sets are unchanged.', 't2'), m.btn('Retry volume', 'secondary')]),
          m.card([m.p('Missing exercise mappings: 2 current and 0 previous hard sets omitted. Deleted exercise details are not guessed.', 't2')])] }))
      ] },
      { h: 'Workout times', id: 'workout-times', frames: [
        m.frame('workout-times', 'Workout times', 'MM-191. Each row opens the phone’s own date or time picker.', m.phone({ cls: 'short', bar: { title: 'Workout times', back: true }, body: [m.group([
          m.row('Day', 'Sat, Oct 3', m.i('right', 's')), m.row('Started', '11:22 AM', m.i('right', 's')), m.row('Ended', '12:14 PM', m.i('right', 's'))]), m.btn('Start the clock again from now', 'secondary', { block: true })] })),
        m.frame('workout-times-next-day', 'A workout that ran past midnight', '', m.phone({ cls: 'short', bar: { title: 'Workout times', back: true }, body: [m.group([
          m.row('Day', 'Sat, Oct 3', m.i('right', 's')), m.row('Started', '11:40 PM', m.i('right', 's')), m.row('Ended', '12:25 AM, next day', m.i('right', 's'))]), '<div style="height:60px"></div>'], over: m.snack('A workout cannot be in the future.') }))
      ] }
    ]
  });
})(mm);
</script>
</body>
</html>
